# .github/workflows/ai-engine.yml
# Runs the IntelliVest AI engine on a smart schedule
# FREE: uses GitHub Actions free tier (2000 min/month, we use ~300)

name: IntelliVest AI Engine

on:
  schedule:
    # All times in UTC. US market = UTC-5 (EST) or UTC-4 (EDT summer)
    # Pre-market scan: 08:00 EST = 13:00 UTC
    - cron: '0 13 * * 1-5'
    # Market open +5min: 09:35 EST = 14:35 UTC
    - cron: '35 14 * * 1-5'
    # Post first hour: 10:30 EST = 15:30 UTC
    - cron: '30 15 * * 1-5'
    # Midday: 12:00 EST = 17:00 UTC
    - cron: '0 17 * * 1-5'
    # Post-lunch: 13:30 EST = 18:30 UTC
    - cron: '30 18 * * 1-5'
    # Power hour: 15:00 EST = 20:00 UTC
    - cron: '0 20 * * 1-5'
    # Closing: 15:45 EST = 20:45 UTC
    - cron: '45 20 * * 1-5'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even outside market hours'
        required: false
        default: 'false'

jobs:
  run-ai-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install anthropic requests python-dateutil

      - name: Run AI Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python scripts/ai_engine.py

      - name: Commit results
        run: |
          git config --local user.email "ai-engine@intellivest"
          git config --local user.name "IntelliVest AI"
          git add data/
          git diff --staged --quiet || git commit -m "AI engine run: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
